# cbindgen.toml - Single source of truth for C header generation.
# Loaded by build.rs via cbindgen::Config::from_file.

language = "C"
pragma_once = true
cpp_compat = true
include_version = true
include_guard = "RENOIR_H"
documentation = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h", "unistd.h", "poll.h"]
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

[export]
include = [
    # Core error handling and types
    "RenoirErrorCode",

    # Handle types
    "RenoirManagerHandle",
    "RenoirRegionHandle",
    "RenoirBufferPoolHandle",
    "RenoirBufferHandle",
    "RenoirAllocatorHandle",
    "RenoirRingBufferHandle",
    "RenoirProducerHandle",
    "RenoirConsumerHandle",
    "RenoirControlRegionHandle",
    "RenoirTopicManagerHandle",
    "RenoirPublisherHandle",
    "RenoirSubscriberHandle",
    "RenoirLeanHandle",
    "RenoirRpcHandle",
    "RenoirFrameHandle",
    "RenoirRingInfo",
    "RenoirMessageHandle",
    "RenoirReservedBufferHandle",
    "RenoirReceivedMessageHandle",

    # ID and sequence types
    "RenoirTopicId",
    "RenoirSequenceNumber",

    # Configuration structures
    "RenoirRegionConfig",
    "RenoirBufferPoolConfig",
    "RenoirTopicOptions",
    "RenoirPublisherOptions",
    "RenoirSubscriberOptions",

    # Message and metadata structures
    "RenoirMessageMetadata",
    "RenoirReceivedMessage",
    "RenoirBufferInfo",

    # Statistics structures
    "RenoirBufferPoolStats",
    "RenoirTopicStats",
    "RenoirRegionStats",
    "RenoirRingStats",
    "RenoirControlStats",
    "RenoirMemoryStats",
    "RenoirRegionRegistryEntry",
    "RenoirTopicInfo",

    # Sensor message layouts
    "RenoirImageFrameHeader",
    "RenoirImuSample"
]

[parse]
parse_deps = true
include = ["renoir"]

[enum]
prefix_with_name = true
