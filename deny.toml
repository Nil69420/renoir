# Configuration for cargo-deny
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
# If true, metadata will be collected with `--all-features`
all-features = true

[output]
feature-depth = 1

[advisories]
# The path where the advisory databases are cloned/fetched into
db-path = "~/.cargo/advisory-dbs"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2024-0375", reason = "atty is unmaintained; pulled in by env_logger/clap, replacement tracked in the backlog" },
    { id = "RUSTSEC-2021-0145", reason = "atty unaligned read on Windows only; this project targets Linux" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is unmaintained but stable; replacement tracked in the backlog" },
]

[licenses]
# The confidence threshold for detecting a license from a license text
confidence-threshold = 0.8
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "cbindgen" },
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
highlight = "all"
# List of crates that are allowed
allow = []
# List of crates to deny
deny = [
    # Deny old versions of openssl due to vulnerabilities
    { name = "openssl", version = "<0.10" },
    # Add other problematic crates here
]
# Certain crates/versions that will be skipped when doing duplicate detection
skip = []
# Similarly to `skip` allows you to skip certain crates from being checked
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a git repository that is not in the allow list is encountered
unknown-git = "warn"
# Lint level for what to happen when a crate from a registry that is not in the allow list is encountered
unknown-registry = "warn"
# List of allowed Git repositories
allow-git = []
# List of allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]