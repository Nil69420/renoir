[package]
name = "renoir"
version = "0.1.0"
edition = "2021"
authors = ["Nilanjan Chowdhury <78751630+Nil69420@users.noreply.github.com>"]
description = "High-performance shared memory manager for inter-process communication"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nil69420/renoir"
readme = "README.md"
keywords = ["shared-memory", "ipc", "ros2", "zero-copy", "memory-management"]
categories = ["memory-management", "concurrency", "api-bindings"]

[lib]
name = "renoir"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "renoir-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
# Core dependencies for shared memory and system operations
libc = "0.2"
memmap2 = "0.9"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.10"
lazy_static = { version = "1.4", optional = true }
crc32fast = "1.3"

# Safe POSIX syscall wrappers - replaces manual libc calls  
nix = { version = "0.27", features = ["fs", "mman", "poll", "event"] }

# Async event-driven I/O - replaces manual poll loops
mio = { version = "0.8", features = ["os-poll", "net", "os-ext"] }

# Official FlatBuffers implementation
flatbuffers = "23.5"

# Non-poisoning locks and condvar for real-time safety
parking_lot = "0.12"

# For CLI tool
clap = { version = "4.0", optional = true }

# FFI dependencies (lazy_static already added above)

[build-dependencies]
# C++ header generation for ROS2 interop
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"
loom = "0.7"
shuttle = "0.8"

[features]
default = ["file-backed", "memfd", "c-api"]
file-backed = []
memfd = []
c-api = ["lazy_static"]
cli = ["clap"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "allocator_bench"
harness = false

[[bench]]
name = "ringbuf_bench" 
harness = false

[[bench]]
name = "topic_rings_bench"
harness = false

[[bench]]
name = "broadcast_frames_bench"
harness = false

[[bench]]
name = "latency_pingpong"
harness = false

[package.metadata.docs.rs]
features = ["file-backed", "memfd", "c-api"]

[package.metadata.deb]
maintainer = "Nilanjan Chowdhury <78751630+Nil69420@users.noreply.github.com>"
copyright = "2026 Nilanjan Chowdhury"
license-file = ["LICENSE-MIT", "0"]
section = "libs"
extended-description = """High-performance shared memory manager for inter-process communication.
Provides a stable C ABI (librenoir.so) and a CLI for shared-memory region and
topic management."""
assets = [
    ["target/release/librenoir.so", "usr/lib/", "644"],
    ["include/renoir.h", "usr/include/", "644"],
    ["target/release/renoir-cli", "usr/bin/", "755"],
]
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(miri)'] }
