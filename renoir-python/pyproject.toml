[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "renoir-python"
version = "0.9.0"

[tool.maturin]
module-name = "renoir_python"
features = ["pyo3/extension-module"]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
