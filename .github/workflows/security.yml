name: Dependency audit and unsafe report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory audit, licences and unsafe usage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - run: cargo install cargo-audit cargo-deny cargo-geiger --locked
    - run: cargo audit
    - run: cargo deny check
    - name: Unsafe usage report
      run: cargo geiger --format GitHubMarkdown > unsafe-report.md
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: unsafe-report
        path: unsafe-report.md
        retention-days: 30
