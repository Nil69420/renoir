name: Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  miri:
    name: Miri (default and tree borrows)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb
      with:
        toolchain: nightly
        components: miri
    - name: Miri default
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      run: cargo miri test --test lean_ring_tests --test lean_wait_tests --test lean_multi_tests --test lean_gate_tests --test lean_batch_tests --test broadcast_view_tests --test ring_init_race_tests --test broadcast_ring_tests --test lean_stamped_tests --test lean_hostile_header_tests
    - name: Miri tree borrows
      env:
        MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-symbolic-alignment-check
      run: cargo miri test --test lean_ring_tests --test lean_wait_tests --test lean_multi_tests --test lean_gate_tests --test lean_batch_tests --test broadcast_view_tests --test ring_init_race_tests --test broadcast_ring_tests --test lean_stamped_tests --test lean_hostile_header_tests

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb
      with:
        toolchain: nightly
        components: rust-src
    - name: Test under sanitizer
      env:
        RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      run: >
        cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
        --test lean_ring_tests --test lean_wait_tests --test lean_multi_tests --test lean_gate_tests --test lean_batch_tests --test broadcast_view_tests --test ring_init_race_tests --test broadcast_ring_tests
        --test lean_zero_alloc --test zero_alloc_paths --test lean_stamped_tests --test lean_stamped_process_tests --test lean_hostile_header_tests --test lean_qos_complete_tests --test frame_qos_tests --test rpc_qos_tests --test lean_chaos_tests
        --test lean_chaos_multi_tests --test lean_chaos_gate_tests --test rpc_tests

  loom:
    name: Loom model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - name: Run loom
      env:
        RUSTFLAGS: --cfg loom
        LOOM_MAX_PREEMPTIONS: 3
      run: cargo test --release --test lean_loom --test lean_shuttle

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb
      with:
        toolchain: nightly
    - run: cargo install cargo-fuzz --locked
    - name: Run targets
      working-directory: fuzz
      run: |
        for t in lean_corrupt_ring lean_hostile_header broadcast_corrupt_ring frame_corrupt_ring control_info sensor_validators; do
          cargo fuzz run "$t" -- -max_total_time=60 -timeout=5
        done

  c-abi:
    name: C and C++ ABI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - run: sudo apt-get update && sudo apt-get install -y valgrind cmake cppcheck
    - name: C ABI test with UBSan and valgrind
      run: tests/c/run.sh
    - name: cppcheck
      run: cppcheck --enable=all --inconclusive --check-level=exhaustive --error-exitcode=1 --suppress=missingIncludeSystem --suppress=checkersReport -Iinclude tests/c/lean_abi_test.c tests/c/rpc_abi_test.c tests/c/frame_abi_test.c tests/c/lean_stamped_abi_test.c tests/c/discovery_watch_abi_test.c tests/c/lean_qos_abi_test.c tests/c/frame_qos_abi_test.c tests/c/rpc_qos_abi_test.c
    - name: Exported symbol baseline
      run: tests/abi/check.sh
    - name: ABI compatibility (libabigail)
      run: |
        sudo apt-get update && sudo apt-get install -y abigail-tools
        tests/abi/abidiff.sh
    - name: C++ wrapper tests
      run: |
        cmake -S . -B build -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF
        cmake --build build -j
        ctest --test-dir build --output-on-failure

  supply-chain:
    name: Audit and deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - run: cargo install cargo-audit cargo-deny --locked
    - run: cargo audit
    - run: cargo deny check

  cross-aarch64:
    name: Build for aarch64 (Jetson)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
        targets: aarch64-unknown-linux-gnu
    - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
    - name: Build
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: cargo build --release --target aarch64-unknown-linux-gnu --lib

  aarch64-native:
    name: Native aarch64 ordering stress
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - name: Lean ring, wait, chaos and cross-process tests, repeated
      run: |
        cargo test --profile testing --test lean_ring_tests --test lean_wait_tests --test lean_multi_tests --test lean_gate_tests --test lean_batch_tests --test lean_qos_tests --test rpc_tests --test broadcast_view_tests --test lean_chaos_tests --test lean_chaos_multi_tests --test lean_chaos_gate_tests --test lean_cross_process_tests --test ring_init_race_tests --test zero_alloc_paths --test lean_stamped_tests --test lean_stamped_process_tests --test lean_hostile_header_tests --test lean_qos_complete_tests --test frame_qos_tests --test rpc_qos_tests --no-run
        for _ in $(seq 1 50); do
          cargo test --profile testing --test lean_ring_tests --test lean_wait_tests --test lean_multi_tests --test lean_gate_tests --test lean_batch_tests --test lean_qos_tests --test rpc_tests --test broadcast_view_tests --test lean_chaos_tests --test lean_chaos_multi_tests --test lean_chaos_gate_tests --test lean_cross_process_tests --test ring_init_race_tests --test zero_alloc_paths --test lean_stamped_tests --test lean_stamped_process_tests --test lean_hostile_header_tests --test lean_qos_complete_tests --test frame_qos_tests --test rpc_qos_tests
        done
    - name: Latency
      run: cargo bench --bench latency_pingpong -- 0 1

  litmus:
    name: Memory-model litmus tests (herd7)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: sudo apt-get update && sudo apt-get install -y opam
    - run: |
        opam init -y --bare --disable-sandboxing
        opam switch create herd ocaml-base-compiler.5.2.0 -y
        eval "$(opam env --switch=herd)"
        opam install -y herdtools7
        tests/litmus/run.sh

  latency:
    name: Latency smoke (non-gating numbers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - run: cargo bench --bench latency_pingpong -- 0 1

  python:
    name: Python bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
    - run: pip install maturin pytest
    - name: Build and test
      working-directory: renoir-python
      run: |
        python -m venv .venv
        . .venv/bin/activate
        pip install maturin pytest
        maturin develop --release
        python -m pytest -q tests

  formal:
    name: TLA+ model check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - run: formal/run.sh

  kani:
    name: Kani bounded proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237
      with:
        args: --lib

  toolchain-canary:
    name: Latest runner image canary (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      with:
        toolchain: stable
        components: clippy
    - run: sudo apt-get update && sudo apt-get install -y valgrind cmake
    - run: cargo clippy --all-targets --all-features -- -D warnings
    - name: C ABI test on the newest image and toolchain
      run: tests/c/run.sh

